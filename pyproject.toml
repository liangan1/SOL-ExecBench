[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sol-execbench"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.5",
    "safetensors>=0.7.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
sol-execbench = "sol_execbench.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadgroup"
markers = [
    "cpp: test compiles C++/CUDA extensions (slow, requires compiler toolchain)",
    "requires_cutile: test requires cuTile (sm_100+ / Blackwell GPU)",
]

[tool.ruff]
# Exclude generated code from linting and formatting
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".ruff_cache",
    "data",
    "examples"
]

[tool.ruff.lint]
ignore = ["E741"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

